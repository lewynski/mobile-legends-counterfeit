<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Hero Counter Guide</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Arial, sans-serif; color: #111; background: #fff; line-height: 1.5; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.5px; }
  .sub { color: #666; margin: 0 0 24px; }
  input[type="search"] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid #ddd; border-radius: 10px; outline: none; }
  input[type="search"]:focus { border-color: #111; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px; }
  .filters button { border: 1px solid #ddd; background: #fff; padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .filters button.active { background: #111; color: #fff; border-color: #111; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .card { border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px; cursor: pointer; background: #fff; text-align: left; font: inherit; }
  .card:hover, .card.selected { border-color: #111; }
  .card strong { display: block; font-size: 16px; }
  .card span { color: #666; font-size: 13px; }
  #detail { margin-top: 32px; border-top: 1px solid #e5e5e5; padding-top: 24px; }
  #detail h2 { margin: 0 0 4px; }
  .meta { color: #666; margin: 0 0 16px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .cols { grid-template-columns: 1fr; } }
  .box { border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; }
  .box h3 { margin: 0 0 10px; font-size: 15px; }
  .chip { display: inline-block; border: 1px solid #ddd; border-radius: 999px; padding: 5px 11px; margin: 0 6px 6px 0; cursor: pointer; background: #fff; font: inherit; font-size: 14px; }
  .chip:hover { border-color: #111; }
  .tip { background: #f7f7f7; border-radius: 12px; padding: 16px; margin-top: 16px; }
  .empty { color: #666; padding: 20px 0; }
  footer { color: #888; font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>ML Hero Counter Guide</h1>
  <p class="sub">Search a hero to see what they are strong against, and what counters them.</p>

  <label for="search">Search hero</label>
  <input id="search" type="search" placeholder="Try: Ling, Layla, Esmeralda…" autocomplete="off">

  <div class="filters" id="filters" aria-label="Filter by role"></div>
  <div class="grid" id="grid"></div>

  <section id="detail" aria-live="polite"></section>
  <footer>General matchup guide. Matchups can change with patches, items, and team play.</footer>
</main>

<script>
const HEROES = [
  { name:"Layla", role:"Marksman", lane:"Gold Lane", advantage:"Very long range and strong late-game damage when she can attack safely from behind her team.", strong:["Tigreal","Franco","Estes"], weak:["Ling","Gusion","Hayabusa"], tip:"Dive her early and lock her down before she scales. Do not fight her head-on late game." },
  { name:"Miya", role:"Marksman", lane:"Gold Lane", advantage:"Fast attack speed and invisibility let her reposition and shred targets in longer fights.", strong:["Layla","Estes","Valir"], weak:["Khufra","Ling","Saber"], tip:"Use vision, crowd control, and burst before she can use her ultimate to escape." },
  { name:"Lesley", role:"Marksman", lane:"Gold Lane", advantage:"Long-range critical shots punish slow or low-mobility heroes from a safe distance.", strong:["Tigreal","Yu Zhong","Estes"], weak:["Ling","Hayabusa","Khufra"], tip:"Close the gap quickly. She is weak when dived and forced to move." },
  { name:"Granger", role:"Marksman", lane:"Gold Lane", advantage:"Strong early burst and mobility let him win short trades and rotate fast.", strong:["Layla","Miya","Angela"], weak:["Chou","Lancelot","Khufra"], tip:"Dodge his skill shots and fight him with crowd control or a mobile diver." },
  { name:"Wanwan", role:"Marksman", lane:"Gold Lane", advantage:"High mobility and true damage after hitting all weak points, strong against slow frontlines.", strong:["Tigreal","Franco","Esmeralda"], weak:["Khufra","Ling","Saber"], tip:"Stop her from hitting all weak points. Use crowd control and burst when she is exposed." },
  { name:"Beatrix", role:"Marksman", lane:"Gold Lane", advantage:"Four weapons give her range, burst, and area damage for different fight situations.", strong:["Atlas","Tigreal","Yu Zhong"], weak:["Gusion","Ling","Chou"], tip:"Dive her with an assassin or fighter. She struggles when she cannot keep distance." },

  { name:"Gusion", role:"Assassin", lane:"Jungle", advantage:"Fast dagger combos burst down squishy heroes before they can react.", strong:["Layla","Miya","Eudora"], weak:["Khufra","Chou","Paquito"], tip:"Pick crowd control or a durable fighter, and do not walk alone late game." },
  { name:"Lancelot", role:"Assassin", lane:"Jungle", advantage:"Dashes and brief immunity let him dodge skills and chase low-health targets.", strong:["Lesley","Granger","Valir"], weak:["Khufra","Chou","Franco"], tip:"Save crowd control for after his dashes, or use a hero who can lock him down." },
  { name:"Hayabusa", role:"Assassin", lane:"Jungle", advantage:"Shadows let him split-push and isolate one target with heavy single-target damage.", strong:["Layla","Lesley","Estes"], weak:["Khufra","Paquito","Esmeralda"], tip:"Stay grouped, use crowd control, and punish him when his shadows are down." },
  { name:"Ling", role:"Assassin", lane:"Jungle", advantage:"Wall movement gives him unmatched map mobility and surprise dives on backline heroes.", strong:["Layla","Miya","Lunox"], weak:["Khufra","Franco","Chou"], tip:"Use anti-dash crowd control like Khufra, and protect your backline." },
  { name:"Saber", role:"Assassin", lane:"Jungle", advantage:"Simple, reliable single-target burst that can delete a key carry early.", strong:["Layla","Wanwan","Angela"], weak:["Paquito","Yu Zhong","Esmeralda"], tip:"Build durability, stay with your team, and use crowd control after he commits." },
  { name:"Karina", role:"Assassin", lane:"Jungle", advantage:"True damage and resets let her clean up fights once enemies are low.", strong:["Lesley","Granger","Beatrix"], weak:["Esmeralda","Yu Zhong","Chou"], tip:"Do not give her low-health resets. Use shields, sustain, and crowd control." },

  { name:"Chou", role:"Fighter", lane:"EXP Lane", advantage:"High mobility, crowd control immunity, and a strong kick for isolating targets.", strong:["Layla","Ling","Granger"], weak:["Esmeralda","Yu Zhong","Paquito"], tip:"Use durable heroes and team crowd control. Do not let him pick off one target alone." },
  { name:"Paquito", role:"Fighter", lane:"EXP Lane", advantage:"Fast combos, shields, and crowd control make him strong in duels and skirmishes.", strong:["Gusion","Saber","Miya"], weak:["Esmeralda","Yu Zhong","Khufra"], tip:"Kite him, use crowd control between combos, and avoid long trades." },
  { name:"Yu Zhong", role:"Fighter", lane:"EXP Lane", advantage:"Dragon form and lifesteal let him dive, disrupt, and survive long team fights.", strong:["Miya","Lesley","Karina"], weak:["Esmeralda","Lunox","Valir"], tip:"Use anti-heal, kiting, and burst. Do not fight him inside his petrify and dragon form." },
  { name:"Esmeralda", role:"Fighter", lane:"EXP Lane", advantage:"She steals shields and turns enemy shields into her own durability.", strong:["Yu Zhong","Paquito","Chou"], weak:["Lunox","Valir","Kagura"], tip:"Use true damage, burst, and heroes who do not rely on shields." },

  { name:"Tigreal", role:"Tank", lane:"Roam", advantage:"Big area crowd control can start fights and lock down multiple enemies.", strong:["Layla","Wanwan","Eudora"], weak:["Valir","Lunox","Esmeralda"], tip:"Use knockback, purify-style escapes, or poke him before he can engage." },
  { name:"Atlas", role:"Tank", lane:"Roam", advantage:"His ultimate can pull a whole team together for a big combo.", strong:["Layla","Miya","Lesley"], weak:["Valir","Lunox","Kagura"], tip:"Spread out, save a dash or crowd-control break, and punish a missed ultimate." },
  { name:"Khufra", role:"Tank", lane:"Roam", advantage:"He stops dashes and jumps, which shuts down many mobile assassins.", strong:["Ling","Gusion","Lancelot"], weak:["Valir","Lunox","Esmeralda"], tip:"Use ranged poke and non-dash heroes. Do not rely on dashes against him." },
  { name:"Franco", role:"Tank", lane:"Roam", advantage:"A long hook and suppressing ultimate can pick off one key target instantly.", strong:["Ling","Lancelot","Estes"], weak:["Valir","Yu Zhong","Esmeralda"], tip:"Stay behind minions or frontline heroes, and keep a dash or escape ready." },

  { name:"Valir", role:"Mage", lane:"Mid Lane", advantage:"Long-range poke and knockback keep divers and tanks away from his team.", strong:["Tigreal","Khufra","Atlas"], weak:["Ling","Gusion","Hayabusa"], tip:"Dive him fast with a mobile assassin. He is weak when caught without distance." },
  { name:"Lunox", role:"Mage", lane:"Mid Lane", advantage:"Percent-based damage shreds tanks and shield-heavy heroes.", strong:["Tigreal","Esmeralda","Yu Zhong"], weak:["Ling","Saber","Gusion"], tip:"Burst her before she can cycle her skills, or dive her with an assassin." },
  { name:"Eudora", role:"Mage", lane:"Mid Lane", advantage:"Simple point-and-click burst can delete a squishy target in one combo.", strong:["Layla","Miya","Karina"], weak:["Chou","Paquito","Khufra"], tip:"Use durable heroes, crowd control, and do not face-check bushes alone." },
  { name:"Kagura", role:"Mage", lane:"Mid Lane", advantage:"Umbrella poke, crowd control, and mobility make her hard to pin down.", strong:["Tigreal","Atlas","Esmeralda"], weak:["Ling","Hayabusa","Lancelot"], tip:"Use fast divers and crowd control when her umbrella is away from her." },

  { name:"Angela", role:"Support", lane:"Roam", advantage:"Her ultimate lets her shield and support an ally anywhere on the map.", strong:["Paquito","Chou","Yu Zhong"], weak:["Saber","Gusion","Khufra"], tip:"Burst her host target, use anti-heal, and crowd-control Angela when she appears." },
  { name:"Estes", role:"Support", lane:"Roam", advantage:"Strong team healing keeps his whole team alive through long fights.", strong:["Tigreal","Atlas","Yu Zhong"], weak:["Ling","Hayabusa","Saber"], tip:"Use anti-heal items, burst, and dive Estes first in team fights." }
];

const ROLES = ["All","Marksman","Assassin","Fighter","Tank","Mage","Support"];
let role = "All";
let query = "";
const grid = document.getElementById("grid");
const detail = document.getElementById("detail");
const filtersEl = document.getElementById("filters");

ROLES.forEach(r => {
  const b = document.createElement("button");
  b.textContent = r;
  b.className = r === "All" ? "active" : "";
  b.onclick = () => {
    role = r;
    document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("active", x.textContent === r));
    render();
  };
  filtersEl.appendChild(b);
});

function find(name) { return HEROES.find(h => h.name === name); }

function render() {
  const list = HEROES.filter(h =>
    (role === "All" || h.role === role) &&
    h.name.toLowerCase().includes(query.toLowerCase())
  );
  grid.innerHTML = "";
  if (!list.length) {
    grid.innerHTML = '<p class="empty">No hero found. Try another name.</p>';
    return;
  }
  list.forEach(h => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<strong>${h.name}</strong><span>${h.role} · ${h.lane}</span>`;
    b.onclick = () => show(h.name);
    grid.appendChild(b);
  });
}

function chips(names) {
  return names.map(n => `<button class="chip" onclick="show('${n}')">${n}</button>`).join("");
}

window.show = function(name) {
  const h = find(name);
  if (!h) return;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("selected", c.textContent.includes(h.name)));
  detail.innerHTML = `
    <h2>${h.name}</h2>
    <p class="meta">${h.role} · ${h.lane}</p>
    <p><strong>Advantage:</strong> ${h.advantage}</p>
    <div class="cols">
      <div class="box"><h3>Strong against</h3>${chips(h.strong)}</div>
      <div class="box"><h3>Countered by</h3>${chips(h.weak)}</div>
    </div>
    <div class="tip"><strong>How to counter ${h.name}:</strong> ${h.tip}</div>
  `;
  detail.scrollIntoView({ behavior: "smooth", block: "start" });
};

document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });
render();
show("Ling");
</script>
</body>
</html>
